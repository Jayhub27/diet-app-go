name: dietapp
version: '1.0.0'
summary: AI-powered nutrition assistant
description: |
  DietApp is an AI-powered nutrition assistant that helps you plan meals,
  manage your pantry, track dietary restrictions, and generate recipes.
  It supports multiple AI providers (OpenAI, OpenRouter, Ollama, LM Studio)
  and stores all data locally in SQLite.

base: core22
grade: stable
confinement: strict

architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [arm64]
    build-for: [arm64]

apps:
  dietapp:
    command: bin/dietapp
    plugs:
      - network
      - network-bind
      - home
    environment:
      DIETAPP_DATA_DIR: $SNAP_USER_COMMON

parts:
  dietapp:
    plugin: go
    source: .
    build-snaps:
      - go/1.23/stable
    build-packages:
      - gcc
      - libc6-dev
    override-build: |
      CGO_ENABLED=0 go build -ldflags="-s -w" -o $SNAPCRAFT_PART_INSTALL/bin/dietapp ./cmd/server
    stage-packages:
      - ca-certificates

plugs:
  home:
    read: all
