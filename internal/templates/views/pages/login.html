{{define "body"}}
<div class="auth-card">
  <h1>Sign in</h1>
  {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
  <form method="post" action="/auth/login">
    <input name="email" type="email" required placeholder="email">
    <input name="password" type="password" required placeholder="password">
    <button class="btn-primary" type="submit" style="margin-top:0.5rem">Sign in</button>
  </form>
  <p class="auth-card__footer">No account? <a href="/auth/register">Create one</a></p>
</div>
{{end}}
