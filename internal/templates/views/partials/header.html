{{define "header"}}<header class="app-header">
  <div class="app-header__inner">
    <a href="/" class="app-header__brand">
      <span aria-hidden="true">🥗</span> DietApp Lite
    </a>
    <nav class="app-header__nav" aria-label="Main">
      <a href="/chat">Chat</a>
      <a href="/pantry">Pantry</a>
      <a href="/library">Library</a>
      <a href="/models">Models</a>
      <a href="/profile">Profile</a>
    </nav>
    <div class="app-header__actions">
      <a href="/scan" class="header-capture" title="Scan a label or product" aria-label="Scan a label or product">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8h2l1.5-2h9L18 8h2v11H4z"/>
          <circle cx="12" cy="13" r="3.2"/>
        </svg>
      </a>
      <button class="theme-toggle" type="button" onclick="window.__toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="8"/>
          <path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      {{if .User}}
        {{if .User.IsAnonymous}}
          <a class="header-account" href="/auth/login">Sign in</a>
        {{else}}
          <a class="header-account" href="/auth/logout">Sign out</a>
        {{end}}
      {{end}}
    </div>
  </div>
</header>
{{end}}
